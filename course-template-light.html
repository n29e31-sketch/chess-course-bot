body.trainer-active.trainer-complete #nav-btns { display: flex !important; }
body.trainer-active.trainer-complete .trainer-board-hint { display: none !important; }
.trainer-complete-banner {
  padding: 16px 22px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08);
}
.trainer-complete-banner h3 { color: var(--status-success); font-size: 17px; margin: 0 0 12px 0; }
.trainer-complete-banner .trainer-done-btns { display: flex; gap: 10px; justify-content: center; }
.trainer-complete-banner .trainer-done-btns button {
  border: none; padding: 9px 20px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
}
.trainer-complete-banner .btn-next-var {
  background: var(--sidebar-active); color: #fff;
}
.trainer-complete-banner .btn-next-var:hover { filter: brightness(1.1); }
.trainer-complete-banner .btn-exit-trainer {
  background: rgba(255,255,255,0.08); color: var(--text);
}
.trainer-complete-banner .btn-exit-trainer:hover { background: rgba(255,255,255,0.15); }

.board-b72b1 { border-radius: 0; }
/* Board colors applied dynamically via #board-theme-style */
/* King-in-check highlight */
.board-b72b1 .square-55d63.highlight-check {
  background: radial-gradient(ellipse at center, #ff0000 0%, #cc0000 50%, rgba(180,0,0,0.4) 100%) !important;
}

/* ===== Settings panel ===== */
.settings-panel {
  display: none; position: fixed; z-index: 1000;
  background: #14191f; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; padding: 16px; min-width: 220px; max-width: calc(100vw - 20px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4); color: var(--text);
  font-size: 14px;
}
.settings-panel.open { display: block; }
.settings-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--text-dim); }
.settings-select {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  background: #0f161f; border: 1px solid rgba(255,255,255,0.15);
  color: var(--text); font-size: 14px; cursor: pointer; outline: none;
}
.settings-select:focus { border-color: var(--sidebar-active); }
.settings-reset {
  width: 100%; padding: 7px; border-radius: 6px; border: none;
  background: rgba(255,255,255,0.08); color: var(--text-dim);
  font-size: 13px; cursor: pointer;
}
.settings-reset:hover { background: rgba(255,255,255,0.15); }

/* ===== Mobile responsive ===== */
@media (max-width: 900px) {
  body { height: 100%; height: 100dvh; overflow: hidden; }
  .app { flex-direction: column; height: 100%; height: 100dvh; overflow: hidden; min-height: 0; }

  /* Sidebar as overlay drawer — iOS needs pointer-events only when open */
  .sidebar-wrapper {
    position: fixed; top: 0; left: 0; z-index: 100;
    height: 100%; height: 100dvh;
    pointer-events: none;
  }
  .sidebar {
    width: min(280px, 88vw); min-width: 0; height: 100%; height: 100dvh;
    transform: translateX(-105%); transition: transform 0.25s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    pointer-events: none;
    -webkit-overflow-scrolling: touch;
  }
  .sidebar.mobile-open {
    transform: translateX(0);
    pointer-events: auto;
  }
  .sidebar.collapsed { transform: translateX(-105%); pointer-events: none; }
  .sidebar-toggle { display: none; }
  .mobile-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 99;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
  }
  .mobile-overlay.show { display: block; }

  /* Board area fixed at top - does NOT scroll */
  .board-area { padding: 0; width: 100%; flex-shrink: 0; }
  #board-wrap { width: min(100vw, calc(100dvh - 200px)) !important; height: min(100vw, calc(100dvh - 200px)) !important; max-width: 500px; max-height: 500px; margin: 0 auto; }
  #board-wrap #board-play-area { width: 100%; height: 100%; }
  .board-label { display: none; }
  .nav-btns { display: none; } /* hide desktop nav on mobile */

  /* Notation panel scrollable below board, above bottom bar */
  .notation-panel {
    width: 100%; min-width: 0; margin: 0;
    border-radius: 0; flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .notation-panel .practice-header { display: none; }
  .teach-comment { padding: 12px 16px 80px 16px; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Mobile bottom nav bar */
  .mobile-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; padding: 0 8px; height: 32px;
    background: var(--body-bg); border-top: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
  }
  .mobile-nav button {
    background: rgba(255,255,255,0.08); border: none; color: var(--text);
    font-size: 13px; padding: 3px 10px; border-radius: 4px; cursor: pointer; height: 24px;
  }
  .mobile-nav button:hover { background: rgba(255,255,255,0.15); }
  .mobile-nav button.next-btn { background: var(--sidebar-active); color: #fff; padding: 3px 14px; }
  .mobile-nav button.next-btn:hover { background: #2899e6; }

  /* Mobile header bar with menu button */
  .mobile-header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px; height: 32px; background: var(--body-bg);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .mobile-header .mobile-menu-btn {
    background: none; border: none; color: var(--text); font-size: 16px;
    cursor: pointer; padding: 0 4px; line-height: 1;
  }
  .mobile-header .mobile-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .mobile-header .mobile-tools { display: flex; gap: 6px; }
  .mobile-header .mobile-tools button {
    background: none; border: none; color: var(--text-dim); font-size: 14px; cursor: pointer; padding: 2px 4px;
  }
  .mobile-header .mobile-tools button:hover { color: var(--text); }

  /* On mobile: hide footer except settings button */
  .practice-footer { display: flex; justify-content: flex-end; padding: 6px 12px; border-top: none; }
  .practice-footer #btn-flip, .practice-footer #btn-analyze, .practice-footer #btn-fs, .practice-footer #btn-settings { display: none; }

  /* Trainer mode on mobile */
  body.trainer-active .mobile-nav { display: none; }
  body.trainer-active .trainer-board-hint { display: block !important; }
  body.trainer-active.trainer-complete .mobile-nav { display: flex; }
  body.trainer-active.trainer-complete .trainer-board-hint { display: none !important; }
  .trainer-comment { padding: 10px 14px; }
  .trainer-quiz { padding: 8px 14px; }
  .trainer-feedback { padding: 8px; min-height: 36px; font-size: 14px; }
  .trainer-moves { padding: 6px 14px; }
  .trainer-done { padding: 20px 14px; }
}

/* ===== Promotion popup ===== */
#promotion-popup {
  display: none;
  position: fixed;
  z-index: 1000;
  background: #0be044;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  padding: 12px;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-width: 80px;
}
#promotion-popup.visible { display: flex; }
#promotion-popup .promo-title {
  font-size: 11px; color: rgba(250,250,250,0.5); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 4px;
}
#promotion-popup .promo-pieces {
  display: flex; flex-direction: column; gap: 4px;
}
#promotion-popup .promo-piece {
  width: 56px; height: 56px; cursor: pointer; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid transparent;
  transition: background 0.12s, border-color 0.12s;
}
#promotion-popup .promo-piece:hover {
  background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25);
}
#promotion-popup .promo-piece img { width: 48px; height: 48px; }
#promotion-overlay {
  display: none; position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,0.3);
}
#promotion-overlay.visible { display: block; }

/* Hide mobile elements on desktop */
@media (min-width: 901px) {
  .mobile-header { display: none; }
  .mobile-overlay { display: none !important; }
  .mobile-nav { display: none; }
  /* Hide fullscreen button on desktop */
  #btn-fs { display: none; }
}

/* ===== Game info bar (right panel, under title) ===== */
.game-info-bar {
  display: none;
  flex-direction: column;
  padding: 5px 16px 7px;
  gap: 2px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text-dim);
}
.game-info-bar.visible { display: flex; }
.game-info-bar .gib-players {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.game-info-bar .gib-players .gib-sq {
  display: inline-block;
  width: 11px; height: 11px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.2);
  vertical-align: middle;
  margin-right: 2px;
}
.game-info-bar .gib-players .gib-sq.w { background: #f0d9b5; }
.game-info-bar .gib-players .gib-sq.b { background: #2d2d2d; }
.game-info-bar .gib-players .gib-elo { font-size: 11.5px; font-weight: 400; opacity: 0.55; }
.game-info-bar .gib-players .gib-res { font-size: 12px; font-weight: 400; opacity: 0.7; margin-left: 6px; }
.game-info-bar .gib-meta {
  font-size: 11.5px;
  color: var(--text-dim);
  opacity: 0.8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<div class="app">
  <!-- Mobile header bar -->
  <div class="mobile-header">
    <button class="mobile-menu-btn" id="mobileMenuBtn" title="Chapters">☰</button>
    <span class="mobile-title" id="mobile-title">Dragon</span>
    <div class="mobile-tools">
      <button title="MoveTrainer" id="btn-trainer-m">🎓</button>
      <button title="Flip board" id="btn-flip-m">🔄</button>
      <button title="Analyze on Lichess" id="btn-analyze-m">⚡</button>
      <button title="Settings" id="btn-settings-m">⚙</button>
    </div>
  </div>

  <!-- Mobile sidebar overlay -->
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="sidebar-wrapper">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="course-title" id="course-title">Dragon</div>
      </div>
      <div class="sidebar-scroll" id="sidebar-scroll-root">
      </div>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">&#x00BB;</button>
  </div>

  <div class="board-area">
    <div id="board-wrap">
      <div id="board-play-area">
        <div id="board" style="width:440px;height:440px"></div>
        <div id="coord-overlay" class="board-coord-overlay"></div>
      </div>
      <svg class="arrows" xmlns="http://www.w3.org/2000/svg"></svg>
      <span id="cb-turn-dot" class="cb-turn-dot turn-white" title="Turno"></span>
    </div>
    <div class="board-label" id="pos-label">Starting position</div>

  <!-- Promotion overlay and popup -->
  <div id="promotion-overlay"></div>
  <div id="promotion-popup">
    <div class="promo-title">Promocionar a</div>
    <div class="promo-pieces" id="promo-pieces"></div>
  </div>
    <div class="nav-btns" id="nav-btns">
      <button id="btn-prev-var" title="Previous variation">⏮</button>
      <button id="btn-prev" title="Previous">◀</button>
      <button id="btn-next" class="next-btn" title="Next">▶</button>
      <button id="btn-next-var" title="Next variation">⏭</button>
    </div>
    <div class="nav-btns trainer-board-hint" id="trainer-board-hint" style="display:none;">
      <button class="trainer-hint-btn" id="trainer-hint-btn">🔔 Hint</button>
    </div>
    <div class="mobile-nav">
      <button id="btn-prev-var-m" title="Previous variation">⏮</button>
      <button id="btn-prev-m" title="Previous">◀</button>
      <button id="btn-next-m" class="next-btn" title="Next">▶</button>
      <button id="btn-next-var-m" title="Next variation">⏭</button>
    </div>
  </div>

  <div class="notation-panel">
    <div class="practice-header">
      <span class="var-title" id="var-title">Dragon</span>
      <div class="var-nav-btns">
        <button id="btn-trainer" title="MoveTrainer">🎓</button>
        <button id="btn-prev-var-h" title="Previous variation">&#x2039;</button>
        <button id="btn-next-var-h" title="Next variation">&#x203a;</button>
      </div>
    </div>
    <div class="game-info-bar" id="game-info-bar">
      <div class="gib-players">
        <span class="gib-sq w"></span><span id="gib-white"></span><span id="gib-welo" class="gib-elo"></span>
        <span style="opacity:0.35;margin:0 4px">vs</span>
        <span class="gib-sq b"></span><span id="gib-black"></span><span id="gib-belo" class="gib-elo"></span>
        <span id="gib-result" class="gib-res"></span>
      </div>
      <div class="gib-meta" id="gib-meta"></div>
    </div>
    <div class="teach-comment" id="notation"></div>
    <div class="trainer-panel" id="trainer-panel">
      <div class="trainer-comment" id="trainer-comment"></div>
      <div class="trainer-quiz" id="trainer-quiz">
        <h3>Quiz</h3>
        <div class="trainer-prompt" id="trainer-prompt">White to play!</div>
      </div>
      <div class="trainer-feedback" id="trainer-feedback"></div>
      <div class="trainer-moves" id="trainer-moves"></div>
    </div>
    <div class="practice-footer">
      <button title="Flip board" id="btn-flip">🔄</button>
      <button title="Analyze on Lichess" id="btn-analyze">⚡</button>
      <button title="Fullscreen" id="btn-fs">⛶</button>
      <button title="Settings" id="btn-settings">⚙</button>
    </div>
  </div>

<div class="settings-panel" id="settings-panel">
  <h3 style="margin:0 0 14px 0;font-size:15px;font-weight:700;">Settings</h3>
  <div class="settings-row"><label>Board Theme</label></div>
  <div style="margin-bottom:14px;">
    <select class="settings-select" id="sel-board-theme">
      <option value="blue">Blue</option>
      <option value="brown">Brown</option>
      <option value="chessable">Chessable</option>
      <option value="chessbase">ChessBase</option>
      <option value="chessmood">Chessmood</option>
      <option value="chesscom">Chess.com</option>
      <option value="grey">Grey</option>
      <option value="lichess">Lichess</option>
      <option value="olive">Olive</option>
      <option value="purple">Púrpura</option>
      <option value="rose">Rosa</option>
    </select>
  </div>
  <div class="settings-row"><label>Piece set</label></div>
  <div style="margin-bottom:14px;">
    <select class="settings-select" id="sel-piece-theme">
      <option value="alpha">Alpha</option>
      <option value="cburnett">Colin M.L. Burnett</option>
      <option value="embedded">Classic (offline)</option>
      <option value="kiwen-suwi">Kiwen-Suwi</option>
      <option value="kosal">Kosal</option>
      <option value="maestro">Maestro (Lichess)</option>
    </select>
  </div>
  <div class="settings-row" style="margin-top:10px;">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;">
      <input type="checkbox" id="chk-sound" checked> Move sounds
    </label>
  </div>
  <div class="settings-row" style="margin-top:8px;">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;">
      <input type="checkbox" id="chk-free-move" checked> Free play (legal moves off line)
    </label>
  </div>
  <hr style="border:none;border-top:1px solid rgba(255,255,255,0.1);margin:8px 0 12px;">
  <button class="settings-reset" id="btn-settings-reset">Reset to defaults</button>
</div>

const COURSE = {"name":"Sample Course","chapters":[{"lid":0,"title":"PGN Games","variations":[{"oid":"1","title":"Example","result":"*","game":{"title":"Example","result":"*","color":"white","initial":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","data":[{"move":1,"col":"w","san":"e4","showN":true,"isKey":true},{"move":1,"col":"b","san":"e5","showN":true,"hasPgnMarks":true,"draws":[{"object":"arrow","color":"green","move":"1b","start":"e2","end":"e4"}]},{"move":2,"col":"w","san":"Nf3","showN":true}]}}]}]}
// Build lid -> first variation OID lookup (for /course/ID/LID chapter links)
const _lidToOid = {};
for (const ch of COURSE.chapters) {
  if (ch.variations && ch.variations.length > 0 && !(ch.lid in _lidToOid)) {
    _lidToOid[ch.lid] = ch.variations[0].oid;
  }
}

// ===== STATE =====
let currentVar = null; // current variation's game object
let moves = [];
let initialFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
let cursor = -1;
let board = null;
let chess = new Chess();
let orientation = 'white';
/** When set, board shows a sandbox position reached via legal moves (free play). */
let _freeExploreFen = null;
/** Prefer legal moves outside the main line when on and not training. Loaded from settings. */
let _freeMoveMode = true;
const FILES = 'abcdefgh';
function renderBoardCoordOverlay() {
  const ov = document.getElementById('coord-overlay');
  if (!ov) return;
  const selBT = document.getElementById('sel-board-theme');
  const btNameOv = (selBT && selBT.value) || ((typeof _settings !== 'undefined' && _settings.boardTheme) || 'lichess');
  const flipped = orientation === 'black';

  // Resolve current theme colors for coordinate labels.
  // Labels on a dark square → use the light color (contrast)
  // Labels on a light square → use the dark color (contrast)
  // Standard chess: a1 is dark, so square color = (row+col) % 2.
  // In the DOM grid (r=0 is rank 8 for white), a square is dark when (r+c) is ODD (white view).
  // We read the resolved theme from the CSS vars set by applyBoardTheme().
  let lightColor = '#f0d9b5'; // fallback
  let darkColor  = '#b58863';
  const btName = (typeof _settings !== 'undefined' && _settings.boardTheme) || 'lichess';
  // Access BOARD_THEMES if defined in outer scope (it is, inside the settings IIFE).
  // Use a global lookup helper set by applyBoardTheme.
  if (typeof window.__currentBoardThemeColors !== 'undefined') {
    lightColor = window.__currentBoardThemeColors.light || lightColor;
    darkColor  = window.__currentBoardThemeColors.dark  || darkColor;
  }

  let html = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      // Square color: dark when (r+c) is odd (a1=r7,c0 → 7 odd → dark ✓)
      const isDark = (r + c) % 2 === 1;
      // Label color contrasts with its square background
      const labelColor = isDark ? lightColor : darkColor;

      let inner = '';

      // Rank numbers: ALWAYS on the rightmost visual column (c===7)
      const showRank = (c === 7);
      if (showRank) {
        const rankVal = flipped ? (r + 1) : (8 - r);
        // Numbers 1,2,3: un poco más arriba en vista blancas (rows 5,6,7); en negras (rows 0,1,2)
        const isLowRankWhite = !flipped && rankVal <= 3;
        const isLowRankBlack = flipped && rankVal >= 6;
        const isLowRank = isLowRankWhite || isLowRankBlack;
        const topVal = isLowRank ? '0px' : '2px';
        // Todos los números aún más a la izquierda → right grande
        inner += `<span class="board-coord-rank-label" style="color:${labelColor};top:${topVal};right:6px;">${rankVal}</span>`;
      }

      // File letters: ALWAYS on the bottom visual row (r===7)
      const showFile = (r === 7);
      if (showFile) {
        const fileVal = flipped ? FILES[7 - c] : FILES[c];
        // Posición horizontal según la letra y la orientación
        let leftVal;
        if (!flipped) {
          // Vista BLANCAS: a(c=0),b(c=1)→derecha; c-e(c=2-4)→centro; f(c=5),g(c=6),h(c=7)→izquierda
          if (c <= 1)      leftVal = '4px';   // a, b → más a la derecha
          else if (c <= 4) leftVal = '2px';   // c, d, e → centro
          else             leftVal = '0px';   // f, g, h → más a la izquierda
        } else {
          // Vista NEGRAS: h(c=0),g(c=1),f(c=2)→derecha; e-d(c=3-4)→centro; c(c=5),b(c=6),a(c=7)→izquierda
          if (c <= 2)      leftVal = '4px';   // h, g, f → más a la derecha
          else if (c <= 4) leftVal = '2px';   // e, d → centro
          else             leftVal = '0px';   // c, b, a → más a la izquierda
        }
        inner += `<span class="board-coord-file-label" style="color:${labelColor};left:${leftVal};">${fileVal}</span>`;
      }

      html += `<div class="board-coord-cell">${inner}</div>`;
    }
  }
  ov.innerHTML = html;
}

// ===== FEN COMPUTATION (same approach as Chessable) =====
// Apply one move (real or null) to a chess.js instance.
// Returns true on success, false if the move couldn't be applied.
// chess.js's `move()` doesn't support null moves ("--", "Z0"), so for those
// we manually flip the side-to-move and reset ep-square, mirroring how
// python-chess and other PGN tools handle imaginary skips in study mode.
function applyMoveOrNull(c, san) {
  const cleaned = (san || '').replace(/^\d+\.{1,4}\s*/, '').trim();
  if (cleaned === '--' || cleaned === 'Z0') {
    const parts = c.fen().split(' ');
    if (parts.length >= 6) {
      const wasBlack = parts[1] === 'b';
      parts[1] = wasBlack ? 'w' : 'b';
      if (wasBlack) parts[5] = String(parseInt(parts[5]) + 1);
      parts[3] = '-'; parts[4] = '0';
      c.load(parts.join(' '));
    }
    return true;
  }
  return !!c.move(san, {sloppy: true});
}

function getFenAtMove(idx) {
  chess.load(initialFen);
  for (let i = 0; i <= idx; i++) {
    applyMoveOrNull(chess, moves[i].san);
  }
  return chess.fen();
}

// Trailing annotations stripped to get bare SAN for chess.js. Includes
// `=` (equal), `=∞` (unclear), `+=` / `=+` (slight edge), in addition to the
// original eval symbols. `=` is safe in the class because promotion SAN like
// "e8=Q" always ends with the piece letter, never with bare `=`.
const CLEAN_SAN_RE = /(\+-|-\+|\+\/-|-\/\+|=∞|\+=|=\+|[=+#?!⩱⩲×±∓∞⩵⩶≤≥↑↓⇆⇄□△▽○●⬛⬜☆★⊕⊗⊙≈≠∆∇⌓⟳⟲→←↔⇒⇐⇔\u039d])+$/;

function cleanSan(san) {
  // Iteratively strip trailing annotations + whitespace. Chessable JSONs
  // sometimes write annotations with a space separator like "Bxb8 =" — a
  // single regex pass would peel "=" but leave a trailing space, and chess.js
  // would then reject "Bxb8 ". Looping with .trim() between passes also
  // handles stacked annotations like "Bxb8 = !?" or "e4 +-".
  let s = san.replace(/^\d+\.{1,4}\s*/, '');
  while (true) {
    const next = s.trim().replace(CLEAN_SAN_RE, '');
    if (next === s) break;
    s = next;
  }
  return s.trim();
}

// Split a SAN token into [displayMove, annotation] for colored rendering
function splitSanAnn(san) {
  const noPrefix = san.replace(/^\d+\.{1,4}\s*/, '');
  const clean = cleanSan(san);
  const annIdx = noPrefix.indexOf(clean);
  const ann = annIdx >= 0 ? noPrefix.slice(annIdx + clean.length).trim() : '';
  return [san.slice(0, san.indexOf(noPrefix)) + clean, ann];
}

// Try to play a move from a given FEN. Returns new FEN or null.
// fenHistory: all FENs computed so far in this variation line (for rewind logic).
function tryPlayMove(fromFen, san, isFirstInLine, fenHistory) {
  const clean = cleanSan(san);
  if (!clean) return fromFen;

  // Extract move number + color from SAN (e.g. "20.Qc3" -> moveNum=20, isBlack=false)
  const numMatch = san.match(/^(\d+)(\.{1,4})/);
  const sanMoveNum = numMatch ? parseInt(numMatch[1]) : null;
  const sanIsBlack = numMatch ? numMatch[2].length >= 3 : null;

  // Unnumbered SAN = always a black move (white moves must always carry a number).
  // If fromFen is already black-to-move use it directly; otherwise search fenHistory
  // backward for the most recent black-to-move position.
  if (sanMoveNum === null) {
    const blkCandidates = [];
    if (fromFen && fromFen.split(' ')[1] === 'b') {
      blkCandidates.push(fromFen);
    } else {
      if (fenHistory) {
        for (let i = fenHistory.length - 1; i >= 0; i--) {
          if (fenHistory[i] && fenHistory[i].split(' ')[1] === 'b') {
            blkCandidates.push(fenHistory[i]);
            break;
          }
        }
      }
      if (fromFen && !blkCandidates.includes(fromFen)) blkCandidates.push(fromFen);
    }
    for (const base of blkCandidates) {
      try {
        const tmp = new Chess(base);
        const r = tmp.move(clean, {sloppy: true});
        if (r) return {fen: tmp.fen(), from: r.from, to: r.to};
      } catch(e) {}
    }
    return null;
  }

  // When the SAN has a move number, only start with fromFen if it actually matches
  // that move number + color. Otherwise fromFen may belong to the wrong side and
  // a move like "Bd6" could be accepted for the wrong color (e.g. white Bf4-d6
  // instead of black Bf8-d6), producing a completely wrong FEN.
  let candidates = [];
  if (fromFen) {
    const fp = fromFen.split(' ');
    if (parseInt(fp[5]) === sanMoveNum && (fp[1] === 'b') === sanIsBlack)
      candidates.push(fromFen);
    // else: fromFen is the wrong color/move — add as last-resort fallback only
  }

  // Search fenHistory for a FEN that matches the required move number + color.
  // This handles "rewind" cases like 20.Rxg7+ followed by 20.Qc3 in the same V
  // block — Qc3 needs the position BEFORE move 20, not after Rxg7+.
  if (sanMoveNum !== null && fenHistory) {
    for (const hFen of fenHistory) {
      if (!hFen) continue;
      const parts = hFen.split(' ');
      if (parseInt(parts[5]) === sanMoveNum && (parts[1] === 'b') === sanIsBlack) {
        if (!candidates.includes(hFen)) candidates.push(hFen);
      }
    }
  }

  // Also try main-line FENs that match the required move number + color
  if (isFirstInLine || sanMoveNum !== null) {
    if (window._mainLineMoves && sanMoveNum !== null) {
      for (const entry of window._mainLineMoves) {
        if (entry.moveNum === sanMoveNum && entry.isBlack === sanIsBlack) {
          if (!candidates.includes(entry.fen)) candidates.push(entry.fen);
        }
      }
    }
    if (window._mainLineFens && sanMoveNum !== null) {
      for (const mlFen of window._mainLineFens) {
        const parts = mlFen.split(' ');
        if (parseInt(parts[5]) === sanMoveNum && (parts[1] === 'b') === sanIsBlack) {
          if (!candidates.includes(mlFen)) candidates.push(mlFen);
        }
      }
    }
  }

  // Last resort: try the mismatched fromFen anyway (covers edge cases)
  if (fromFen && !candidates.includes(fromFen)) candidates.push(fromFen);

  for (const base of candidates) {
    try {
      const tmp = new Chess(base);
      const r = tmp.move(clean, {sloppy: true});
      if (r) return {fen: tmp.fen(), from: r.from, to: r.to, captured: !!r.captured};
    } catch(e) {}
  }
  return null;
}

// ===== COMMENT PARSING =====
function parseCommentJson(jsonStr) {
  if (!jsonStr) return null;
  try { return JSON.parse(jsonStr); } catch(e) { return null; }
}

// Render comment nodes.
// - currentFen advances after each S node (position after last played move)
// - varBranchFen is the position BEFORE the last S node — this is what a V node
//   (sub-variation) needs, because V nodes are always alternatives to the
//   preceding S move, not continuations after it.
function renderNodes(nodes, startFen, afterFen, inVariation) {
  if (!nodes || nodes.length === 0) return '';

  let html = '';
  let currentFen = startFen; // FEN after the last S played in this line
  let branchFen  = startFen; // FEN *before* the last S — starting point for sub-variations

  // Track whether the next S node needs a move number shown.
  // Always show for white; show for black only at line-start or after a comment/variation.
  let needNum = true;
  // Pending draw data from a C node that follows a S node
  let pendingDraws = null; // { squares, arrows } to attach to next rendered S

  function fenColor(fen) {
    return fen ? fen.split(' ')[1] : 'w'; // 'w' or 'b'
  }
  function fenMoveNum(fen) {
    return fen ? (parseInt(fen.split(' ')[5]) || 1) : 1;
  }
  function numPrefix(fen) {
    const num = fenMoveNum(fen);
    const col = fenColor(fen);
    if (col === 'w') return `<span class="var-num">${num}.</span>`;
    if (needNum)     return `<span class="var-num">${num}…</span>`;
    return '';
  }

  // Extract text and draw data from a C node val (may be string or {text,squares,arrows})
  function cNodeParts(val) {
    if (!val) return { text: '', squares: [], arrows: [] };
    if (typeof val === 'string') return { text: val, squares: [], arrows: [] };
    return { text: val.text || '', squares: val.squares || [], arrows: val.arrows || [] };
  }

  // Encode draw data as a JSON string safe for data attributes
  function encodeDraws(squares, arrows) {
    const all = [
      ...(squares || []).map(s => ({ object: 'circle', color: s.color, start: s.sq })),
      ...(arrows  || []).map(a => ({ object: 'arrow',  color: a.color, start: a.from, end: a.to }))
    ];
    return all.length ? JSON.stringify(all) : '';
  }

  for (let ni = 0; ni < nodes.length; ni++) {
    const node = nodes[ni];
    const key = node.key || node.k;
    const val = node.val || node.v;

    if (key === 'C') {
      const { text, squares, arrows } = cNodeParts(val);
      // Peek: if prev node was S, the draws belong to that move.
      // We handle this by looking at whether we can inject into the last emitted span.
      // Since HTML is already a string, we use a sentinel approach:
      // We'll look ahead from S processing to handle C draws. Here handle standalone C.
      if (text) {
        html += `<span class="comment-text">${formatCommentText(text)}</span> `;
      }
      // If there are draws and no text, or alongside text, store them for the board overlay.
      // Embed as a hidden span that the click handler can read.
      if (squares.length || arrows.length) {
        const encoded = encodeDraws(squares, arrows);
        html += `<span class="var-draws" data-draws="${escHtml(encoded)}" style="display:none"></span>`;
      }
      needNum = true; // always show move number after a comment
      continue;
    }

    if (key === 'S') {
      const cleanVal = cleanSan(val);
      const pfx = numPrefix(currentFen);
      needNum = false;

      // Look ahead: does the immediately next node carry draw data (C node)?
      let drawAttr = '';
      if (ni + 1 < nodes.length) {
        const nextNode = nodes[ni + 1];
        const nk = nextNode.key || nextNode.k;
        if (nk === 'C') {
          const { squares: ns, arrows: na } = cNodeParts(nextNode.val || nextNode.v);
          if (ns.length || na.length) {
            drawAttr = ` data-draws="${escHtml(encodeDraws(ns, na))}"`;
          }
        }
      }

      if (cleanVal === '--') {
        // Null move: flip side-to-move only
        const parts = currentFen.split(' ');
        const p = [...parts];
        const wasBlack = p[1] === 'b';
        p[1] = wasBlack ? 'w' : 'b';
        if (wasBlack) p[5] = String(parseInt(p[5]) + 1);
        p[3] = '-'; p[4] = '0';
        const nullFen = p.join(' ');
        branchFen  = currentFen;
        currentFen = nullFen;
        html += `${pfx}<span class="var-move" data-fen="${escHtml(nullFen)}"${drawAttr}>${toFigurine(escHtml(val))}</span> `;
        needNum = true;
        continue;
      }

      // Try to play the move from currentFen
      let result = null;
      try {
        const tmp = new Chess(currentFen);
        const r = tmp.move(cleanVal, { sloppy: true });
        if (r) result = { fen: tmp.fen(), from: r.from, to: r.to, cap: !!r.captured };
      } catch(e) {}

      if (result) {
        branchFen  = currentFen;
        currentFen = result.fen;
        const [dispMove, dispAnn] = splitSanAnn(val);
        const annHtml = dispAnn ? `<span class="move-ann">${escHtml(dispAnn)}</span>` : '';
        html += `${pfx}<span class="var-move" data-fen="${escHtml(result.fen)}" data-from="${result.from}" data-to="${result.to}" data-capture="${result.cap?'1':'0'}"${drawAttr}>${toFigurine(escHtml(dispMove))}${annHtml}</span> `;
        // After a white move black follows immediately — no "N…" needed unless interrupted
        if (fenColor(branchFen) === 'w') needNum = false;
      } else {
        // Move failed — show it grayed out but don't advance FEN
        const [dispMove, dispAnn] = splitSanAnn(val);
        const annHtml = dispAnn ? `<span class="move-ann">${escHtml(dispAnn)}</span>` : '';
        html += `${pfx}<span class="var-move var-move-err" title="jugada no válida en esta posición">${toFigurine(escHtml(dispMove))}${annHtml}</span> `;
      }
      continue;
    }

    if (key === 'V') {
      needNum = true; // resume move numbers after a variation block
      const children = val;

      // The sub-variation is an alternative to the last S played, so it
      // starts from branchFen (position *before* that S).
      // We validate by trying the first S child of the sub-variation.
      let varStartFen = branchFen;

      // Find first S child to validate/find correct start FEN
      const firstS = (children || []).find(c => (c.key||c.k) === 'S');
      if (firstS) {
        const fsClean = cleanSan(firstS.val || firstS.v || '');
        if (fsClean && fsClean !== '--') {
          // Prefer branchFen; also try currentFen as fallback
          for (const candidate of [branchFen, currentFen]) {
            if (!candidate) continue;
            try {
              const tmp = new Chess(candidate);
              if (tmp.move(fsClean, { sloppy: true })) {
                varStartFen = candidate;
                break;
              }
            } catch(e) {}
          }
        }
      }

      const inner = renderNodes(children, varStartFen, afterFen, true);
      html += `<span class="variation">( ${inner} )</span> `;
      continue;
    }
  }
  return html;
}

function formatCommentText(text) {
  // C nodes from PGN branches now store {text, squares, arrows} objects; handle both formats
  if (text && typeof text === 'object') text = text.text || '';
  if (!text) return '';
  text = text.replace(/@@SANStart@@(.*?)@@SANEnd@@/g, '<span class="san-ref">$1</span>');
  text = text.replace(/@@SANStart@@(.*?)@@SANEnd@@/g, '<span class="san-ref">$1</span>');
  text = text.replace(/CCSANStartCC(.*?)CCSANEndCC/g, '<span class="san-ref">$1</span>');
  text = text.replace(/@@StartBlockQuote@@/g, '<blockquote>');
  text = text.replace(/@@EndBlockQuote@@/g, '</blockquote>');
  text = text.replace(/@@StartBracket@@/g, '(');
  text = text.replace(/@@EndBracket@@/g, ')');
  text = text.replace(/@@StartFEN@@.*?@@EndFEN@@/g, '');
  text = text.replace(/@@HeaderStart@@(.*?)@@HeaderEnd@@/g, '</span><div class="comment-header">$1</div><span class="comment-text">');
  // Rewrite Chessable variation links to local links
  // /variation/48449404/#/3/b -> #48449404/3 (same page, switch variation + move index)
  text = text.replace(/href="\/variation\/(\d+)\/#\/(\d+)\/[wb]"/g,
    'href="#$1/$2" data-var-link="1"');
  // Rewrite Chessable chapter links: /course/COURSEID/LID -> #FIRST_OID_IN_CHAPTER
  text = text.replace(/href="\/course\/\d+\/(\d+)"\s*target="_blank"\s*rel="noopener"/g, function(match, lid) {
    const oid = _lidToOid[lid];
    if (oid) return 'href="#' + oid + '" data-var-link="1"';
    return match;
  });
  // Fallback: also match without target/rel
  text = text.replace(/href="\/course\/\d+\/(\d+)"/g, function(match, lid) {
    const oid = _lidToOid[lid];
    if (oid) return 'href="#' + oid + '" data-var-link="1"';
    return match;
  });
  return text;
}

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/** Build sidebar chapter headers + variation rows from embedded COURSE (used by generator). */
function buildSidebarFromCourse() {
  const root = document.getElementById('sidebar-scroll-root');
  if (!root) return;
  const chunks = [];
  for (const ch of COURSE.chapters || []) {
    chunks.push('<div class="ch-header"><span>' + escHtml(ch.title || 'Chapter') + '</span></div>');
    chunks.push('<div class="var-list open">');
    for (const v of (ch.variations || [])) {
      const oid = String(v.oid ?? '');
      const vt = v.title || (v.game && v.game.title) || 'Variation';
      const res = v.result != null ? v.result : (v.game && v.game.result);
      const suffix = res && res !== '*' ? ' | ' + res : '';
      chunks.push('<div class="var-item" data-oid="' + escHtml(oid) + '"><span class="var-name">' +
        escHtml(vt + suffix) + '</span></div>');
    }
    chunks.push('</div>');
  }
  root.innerHTML = chunks.join('');
}

function syncCourseHeaderFromCourse() {
  const el = document.getElementById('course-title');
  if (el) el.textContent = COURSE.name || 'Course';
  document.title = (COURSE.name || 'Course') + ' · Course';
}

function getCssVar(name, fallback) {
  const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return value || fallback;
}
const DRAW_BRUSH_COLORS = {
  green: getCssVar('--draw-green', '#31cb44'),
  red: getCssVar('--draw-red', '#882020'),
  blue: getCssVar('--draw-blue', '#003088'),
  yellow: getCssVar('--draw-yellow', '#e68f00')
};
const DRAW_COLOR_KEYS = {
  green: DRAW_BRUSH_COLORS.green, red: DRAW_BRUSH_COLORS.red, blue: DRAW_BRUSH_COLORS.blue, yellow: DRAW_BRUSH_COLORS.yellow,
  g: DRAW_BRUSH_COLORS.green, r: DRAW_BRUSH_COLORS.red, b: DRAW_BRUSH_COLORS.blue, y: DRAW_BRUSH_COLORS.yellow
};

const CAL_GLYPH_HEX = { red: '#c62828', green: '#2e7d32', blue: '#1565c0', yellow: '#f9a825' };

/** Conic gradient sólo con los colores presentes en marcadores PGN (notación + glifo). */
function calGlyphConeStyle(drawsFiltered) {
  if (!drawsFiltered || drawsFiltered.length === 0) return '';
  const order = ['red', 'green', 'blue', 'yellow'];
  const present = [];
  order.forEach(c => {
    if (drawsFiltered.some(d => d.color === c)) present.push(CAL_GLYPH_HEX[c]);
  });
  if (present.length === 0) return '';
  if (present.length === 1) return `background:${present[0]}!important`;
  const step = 360 / present.length;
  let start = 0;
  const segs = present.map(hex => {
    const end = start + step;
    const s = `${hex} ${start}deg ${end}deg`;
    start = end;
    return s;
  });
  return `background:conic-gradient(${segs.join(', ')})!important`;
}
const DRAW_OPACITY = parseFloat(getCssVar('--draw-opacity', '0.8')) || 0.8;

function _getBoardSquareCenter(wrapRect, sq) {
  const el = document.querySelector(`[data-square="${sq}"]`);
  if (!el) return null;
  const r = el.getBoundingClientRect();
  return { x: r.left - wrapRect.left + r.width / 2, y: r.top - wrapRect.top + r.height / 2, size: r.width };
}

function _appendBoardArrow(svg, wrapRect, fromSq, toSq, color, extraData) {
  const fc = _getBoardSquareCenter(wrapRect, fromSq);
  const tc = _getBoardSquareCenter(wrapRect, toSq);
  if (!fc || !tc) return null;

  const sqSz = Math.min(fc.size, tc.size) || (wrapRect.width / 8);
  const dx = tc.x - fc.x, dy = tc.y - fc.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 1) return null;

  const ux = dx / dist, uy = dy / dist, px = -uy, py = ux;
  const lineWidth = sqSz / 8;
  const headLen = lineWidth * 2.5, headW = lineWidth * 1.8, shaftW = lineWidth * 0.4;
  const shorten = sqSz * 0.18;
  const tipX = tc.x - ux * shorten, tipY = tc.y - uy * shorten;
  const baseX = tipX - ux * headLen, baseY = tipY - uy * headLen;
  const points = [
    [fc.x + px * shaftW, fc.y + py * shaftW],
    [baseX + px * shaftW, baseY + py * shaftW],
    [baseX + px * headW, baseY + py * headW],
    [tipX, tipY],
    [baseX - px * headW, baseY - py * headW],
    [baseX - px * shaftW, baseY - py * shaftW],
    [fc.x - px * shaftW, fc.y - py * shaftW]
  ];

  const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  poly.setAttribute('points', points.map(c => c[0].toFixed(2) + ',' + c[1].toFixed(2)).join(' '));
  poly.setAttribute('fill', color);
  poly.setAttribute('opacity', DRAW_OPACITY);
  if (extraData) {
    Object.keys(extraData).forEach(function(key) {
      poly.dataset[key] = extraData[key];
    });
  }
  svg.appendChild(poly);
  return poly;
}

function _appendBoardCircle(svg, wrapRect, sq, color, extraData) {
  const c = _getBoardSquareCenter(wrapRect, sq);
  if (!c) return null;

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', c.x);
  circle.setAttribute('cy', c.y);
  circle.setAttribute('r', c.size * 0.46);
  circle.setAttribute('fill', 'none');
  circle.setAttribute('stroke', color);
  circle.setAttribute('stroke-width', c.size * 0.09);
  circle.setAttribute('opacity', DRAW_OPACITY);
  if (extraData) {
    Object.keys(extraData).forEach(function(key) {
      circle.dataset[key] = extraData[key];
    });
  }
  svg.appendChild(circle);
  return circle;
}

// Piece figurines (Chessable style)
const FIG = {K:'♔',Q:'♛',R:'♖',B:'♗',N:'♞'};
const FIG_B = {K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞'};
function toFigurine(san) {
  // Replace leading piece letter with figurine: Nf3 -> ♞f3, Bxf5 -> ♗xf5
  // Don't replace in castling (O-O) or pawn moves (lowercase first char or digit)
  san = san.replace(/\b([KQRBN])(?=[a-hx])/g, (m, p) => FIG[p] || m);
  // Add thin space before novelty symbol Ν (U+039D) so it doesn't look like letter N
  san = san.replace(/\u039d/g, '\u2009\u039d');
  return san;
}

// ===== DRAWINGS (ARROWS & CIRCLES) =====
function renderDrawings(moveIdx) {
  const svg = document.querySelector('svg.arrows');
  svg.innerHTML = '';
  if (moveIdx < 0 || !moves[moveIdx]) return;
  const m = moves[moveIdx];
  if (!m.draws || m.draws.length === 0) return;

  const moveKey = m.move + (m.col === 'w' ? 'w' : 'b');
  const drawings = m.draws.filter(d => d.move === moveKey);
  if (drawings.length === 0) return;

  const wrapRect = document.getElementById('board-wrap').getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);

  for (const d of drawings) {
    const color = DRAW_COLOR_KEYS[d.color] || DRAW_BRUSH_COLORS.green;
    if (d.object === 'circle') {
      _appendBoardCircle(svg, wrapRect, d.start, color);
    } else if (d.object === 'arrow' && d.end) {
      _appendBoardArrow(svg, wrapRect, d.start, d.end, color);
    }
  }
}

// ===== NOTATION RENDERING =====
function _mkMainMoveKey(m) {
  return m.move + (m.col === 'w' ? 'w' : 'b');
}
function _drawsForNotationGlyph(m) {
  const mk = _mkMainMoveKey(m);
  return (m.draws || []).filter(d => d.move === mk);
}
function calGlyphMarkup(i) {
  const m = moves[i];
  if (!m || !m.hasPgnMarks) return '';
  const st = calGlyphConeStyle(_drawsForNotationGlyph(m));
  const styleAttr = st ? ` style="${st.replace(/"/g, '&quot;')}"` : '';
  return `<span class="cal-glyph"${styleAttr} data-cal-idx="${i}" title="Marcadores [%cal]/[%csl]"></span>`;
}

function renderNotation() {
  const container = document.getElementById('notation');
  let html = '';

  function firstBreakIntro(i) {
    const m = moves[i];
    return !!(m.after || m.before || (m.comment && String(m.comment).trim()) ||
      (m.pgnBranches && m.pgnBranches.length));
  }

  // 1) Move line — hasta primer comentario / variante PGN / bloque Chessable
  html += '<div class="move-line"><span class="rewind" id="ml-rewind">⏮</span> ';
  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    let numStr = '';
    if (m.col === 'w' && m.showN) {
      numStr = `<span class="ml-num">${m.move}.</span>`;
    } else if (m.col === 'b' && m.showN) {
      numStr = `<span class="ml-num">${m.move}...</span>`;
    }
    const mlAnn = m.ann1 ? `<span class="move-ann">${escHtml(m.ann1)}</span>` : '';
    const calMk = calGlyphMarkup(i);
    html += `<span class="ml-move" data-idx="${i}">${calMk}${numStr}${toFigurine(escHtml(m.san))}${mlAnn}</span> `;
    if (firstBreakIntro(i)) break;
  }
  html += '</div>';

  if (currentVar.openingComment && String(currentVar.openingComment).trim()) {
    html += `<div class="comment-block comment-opening"><span class="comment-text">${escHtml(currentVar.openingComment).replace(/\n/g, '<br>')}</span></div>`;
  }

  // 2) Comentarios Chessable, comentarios PGN { }, variantes ()
  let commentStarted = !!currentVar.openingComment;
  let firstCommentIdx = null;
  let inlineGroupOpen = false;

  for (let i = 0; i < moves.length; i++) {
    const m = moves[i];
    const hasAfter = !!m.after;
    const hasBefore = !!m.before;
    const pgnTxt = (m.comment && String(m.comment).trim()) ? m.comment.trim() : '';
    const branches = (m.pgnBranches && m.pgnBranches.length) ? m.pgnBranches : null;

    if (!commentStarted && !hasAfter && !hasBefore && !pgnTxt && !branches) continue;
    commentStarted = true;

    if (hasBefore) {
      if (inlineGroupOpen) { html += '</div>'; inlineGroupOpen = false; }
      const parsed = parseCommentJson(m.before);
      if (parsed && parsed.data) {
        const bFen = (parsed.before && parsed.before !== (parsed.after || ''))
          ? parsed.before : getFenAtMove(Math.max(0, i - 1));
        const aFen = parsed.after || bFen;
        html += `<div class="comment-block">${renderNodes(parsed.data, bFen, aFen, false)}</div>`;
      }
    }

    const afterParsed = hasAfter ? parseCommentJson(m.after) : null;
    const hasCommentData = afterParsed && afterParsed.data && afterParsed.data.length > 0;

    if (hasCommentData || pgnTxt || branches) {
      if (inlineGroupOpen) { html += '</div>'; inlineGroupOpen = false; }

      const isFirstComment = (firstCommentIdx === null);
      if (isFirstComment) {
        firstCommentIdx = i;
      } else {
        html += '<div class="move-heading">';
        const numPfx = m.col === 'w' ? `${m.move}. ` : `${m.move}... `;
        const annStr = m.ann1 ? `<span class="move-ann">${escHtml(m.ann1)}</span>` : '';
        html += `<span class="mh-move" data-idx="${i}">${calGlyphMarkup(i)}${numPfx}${toFigurine(escHtml(m.san))}${annStr}</span>`;
        html += '</div>';
      }

      if (hasCommentData) {
        const bFen = (afterParsed.before && afterParsed.before !== afterParsed.after)
          ? afterParsed.before : getFenAtMove(Math.max(0, i - 1));
        const aFen = afterParsed.after || getFenAtMove(i);
        html += `<div class="comment-block">${renderNodes(afterParsed.data, bFen, aFen, false)}</div>`;
      }
      if (pgnTxt) {
        const safeTxt = escHtml(pgnTxt).replace(/\n/g, '<br>');
        html += `<div class="comment-block"><span class="comment-text">${formatCommentText(safeTxt)}</span></div>`;
      }
      if (branches) {
        html += `<div class="pgn-variation-wrap">`;
        for (const br of branches) {
          html += `<span class="variation">( ${renderNodes(br.nodes,
            br.startFen || getFenAtMove(Math.max(0, i - 1)), null, true)} )</span> `;
        }
        html += '</div>';
      }
    } else if (commentStarted) {
      if (!inlineGroupOpen) {
        html += '<div class="inline-moves">';
        inlineGroupOpen = true;
      }
      let inlineNumStr = '';
      if (m.col === 'w') {
        inlineNumStr = `<span class="mh-num">${m.move}.</span>`;
      } else if (m.showN) {
        inlineNumStr = `<span class="mh-num">${m.move}...</span>`;
      }
      const inlineAnn = m.ann1 ? `<span class="move-ann">${escHtml(m.ann1)}</span>` : '';
      html += `<span class="mh-move" data-idx="${i}">${calGlyphMarkup(i)}${inlineNumStr}${toFigurine(escHtml(m.san))}${inlineAnn}</span> `;
    }
  }
  if (inlineGroupOpen) html += '</div>';

  // Result
  const result = currentVar.result;
  if (result && result !== '*') {
    html += `<div style="margin-top:16px;font-weight:700;font-size:16px;color:var(--text-dim)">${escHtml(result)}</div>`;
  }

  container.innerHTML = html;

  // Attach click handlers
  container.querySelectorAll('.cal-glyph').forEach(g => {
    g.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      varState = null;
      cursor = parseInt(g.dataset.calIdx, 10);
      updatePosition();
    });
  });
  container.querySelectorAll('.ml-move, .mh-move').forEach(el => {
    el.addEventListener('click', () => { varState = null; cursor = parseInt(el.dataset.idx); updatePosition(); });
  });
  container.querySelectorAll('.var-move[data-fen]').forEach(el => {
    el.addEventListener('click', () => {
      const fen = el.dataset.fen;
      if (fen && board) {
        // Build varState from all sibling .var-move[data-fen] elements in the same parent
        const parent = el.parentElement;
        const siblings = Array.from(parent.querySelectorAll('.var-move[data-fen]'));
        const clickedIdx = siblings.indexOf(el);
        varState = {
          els: siblings,
          idx: clickedIdx
        };

        if (el.dataset.from && el.dataset.to) {
          _playBoardMoveSound(el.dataset.capture === '1');
        }
        board.position(fen, false);
        document.getElementById('pos-label').textContent = el.textContent;

        // Apply color annotations (arrows/circles) embedded in the move element
        const svgEl = document.querySelector('svg.arrows');
        svgEl.innerHTML = '';
        const rawDraws = el.dataset.draws;
        if (rawDraws) {
          try {
            const draws = JSON.parse(rawDraws);
            const wrapRect = document.getElementById('board-wrap').getBoundingClientRect();
            svgEl.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);
            for (const d of draws) {
              const color = DRAW_COLOR_KEYS[d.color] || DRAW_BRUSH_COLORS.green;
              if (d.object === 'circle') {
                _appendBoardCircle(svgEl, wrapRect, d.start, color);
              } else if (d.object === 'arrow' && d.end) {
                _appendBoardArrow(svgEl, wrapRect, d.start, d.end, color);
              }
            }
          } catch(e) {}
        }

        // Sync ChessBase turn indicator for variation moves
        _syncCbTurnDot(fen);

        clearActive();
        el.classList.add('active');
        // Scroll to active var-move (same as main moves)
        const notationEl = document.getElementById('notation');
        if (notationEl) {
          const cRect = notationEl.getBoundingClientRect();
          const eRect = el.getBoundingClientRect();
          notationEl.scrollTo({top: notationEl.scrollTop + eRect.top - cRect.top - cRect.height * 0.25, behavior: 'smooth'});
        }
        // Update square highlights
        setTimeout(() => {
          document.querySelectorAll('.highlight-from, .highlight-to, .highlight-check').forEach(sq => {
            sq.classList.remove('highlight-from', 'highlight-to', 'highlight-check');
          });
          const fromSq = el.dataset.from;
          const toSq = el.dataset.to;
          if (fromSq) {
            const fromEl = document.querySelector(`[data-square="${fromSq}"]`);
            if (fromEl) fromEl.classList.add('highlight-from');
          }
          if (toSq) {
            const toEl = document.querySelector(`[data-square="${toSq}"]`);
            if (toEl) toEl.classList.add('highlight-to');
          }
          highlightKingInCheck(fen);
        }, 10);
      }
    });
  });
  const rw = document.getElementById('ml-rewind');
  if (rw) rw.addEventListener('click', () => { cursor = -1; updatePosition(); });
}

// ===== CHECK HIGHLIGHT =====
function highlightKingInCheck(fen) {
  document.querySelectorAll('.highlight-check').forEach(el => el.classList.remove('highlight-check'));
  if (!fen) return;
  const tmpChess = new Chess(fen);
  if (!tmpChess.in_check()) return;
  const turn = tmpChess.turn(); // 'w' or 'b'
  const boardArr = tmpChess.board();
  const files = 'abcdefgh';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = boardArr[r][c];
      if (p && p.type === 'k' && p.color === turn) {
        const kingSq = files[c] + (8 - r);
        const sqEl = document.querySelector(`[data-square="${kingSq}"]`);
        if (sqEl) sqEl.classList.add('highlight-check');
        return;
      }
    }
  }
}

// ChessBase theme: tiny turn marker (white/black) from FEN side-to-move
function _syncCbTurnDot(fen) {
  const dot = document.getElementById('cb-turn-dot');
  if (!dot) return;
  const stm = (String(fen).split(' ')[1] || 'w') === 'b' ? 'black' : 'white';
  dot.classList.toggle('turn-white', stm === 'white');
  dot.classList.toggle('turn-black', stm === 'black');
}

// ===== NAVIGATION =====
function updatePosition() {
  _freeExploreFen = null;
  let fen;
  if (cursor < 0) {
    fen = initialFen;
    document.getElementById('pos-label').textContent = 'Starting position';
  } else {
    fen = getFenAtMove(cursor);
    const m = moves[cursor];
    document.getElementById('pos-label').textContent = `${m.move}${m.col === 'w' ? '.' : '...'} ${toFigurine(m.san)}`;
  }
  if (board) board.position(fen, false);

  // Update URL hash with current position
  const currentOid = document.querySelector('.var-item.active')?.dataset?.oid;
  if (currentOid) {
    let newHash;
    if (cursor >= 0) {
      const m = moves[cursor];
      newHash = '#' + currentOid + '/' + m.move + '/' + m.col;
    } else {
      newHash = '#' + currentOid;
    }
    if (location.hash !== newHash) {
      history.replaceState(null, '', newHash);
    }
  }

  // Highlight from/to squares (after board.position re-renders DOM)
  setTimeout(() => {
    document.querySelectorAll('.highlight-from, .highlight-to, .highlight-check').forEach(el => {
      el.classList.remove('highlight-from', 'highlight-to', 'highlight-check');
    });
    if (cursor >= 0) {
      const c2 = new Chess(cursor > 0 ? getFenAtMove(cursor - 1) : initialFen);
      const moveObj = c2.move(moves[cursor].san, {sloppy: true});
      if (moveObj) {
        _playBoardMoveSound(!!moveObj.captured);
        const fromSq = document.querySelector(`[data-square="${moveObj.from}"]`);
        const toSq = document.querySelector(`[data-square="${moveObj.to}"]`);
        if (fromSq) fromSq.classList.add('highlight-from');
        if (toSq) toSq.classList.add('highlight-to');
      }
    }
    highlightKingInCheck(fen);
    renderDrawings(cursor);
    _syncCbTurnDot(fen);
  }, 10);
  clearActive();
  document.querySelectorAll(`.ml-move[data-idx="${cursor}"], .mh-move[data-idx="${cursor}"]`).forEach(el => {
    el.classList.add('active');
    const container = document.getElementById('notation');
    if (container) {
      const cRect = container.getBoundingClientRect();
      const eRect = el.getBoundingClientRect();
      container.scrollTo({top: container.scrollTop + eRect.top - cRect.top - cRect.height * 0.25, behavior: 'smooth'});
    }
  });
}

function clearActive() {
  document.querySelectorAll('.ml-move.active, .mh-move.active, .var-move.active').forEach(el => el.classList.remove('active'));
}

  // ── Game info bar ─────────────────────────────────────────────────────────
  function updateGameInfoBar(v) {
    const bar = document.getElementById('game-info-bar');
    if (!bar) return;
    const g = v.game || v;
    const white  = g.white  || v.white;
    const black  = g.black  || v.black;
    const wElo   = g.whiteElo || v.whiteElo;
    const bElo   = g.blackElo || v.blackElo;
    const result = (g.result || v.result || '').replace('*','').trim();
    const date   = (g.date   || v.date   || '').replace(/[?]/g,'').replace(/\.$/,'').trim();
    const event  = (g.event  || v.event  || '').replace(/[?]/g,'').trim();
    const site   = (g.site   || v.site   || '').replace(/[?]/g,'').trim();
    const round  = (g.round  || v.round  || '').replace(/[?]/g,'').trim();

    if (!white || !black) { bar.classList.remove('visible'); return; }

    document.getElementById('gib-white').textContent  = white;
    document.getElementById('gib-black').textContent  = black;
    document.getElementById('gib-welo').textContent   = wElo  ? ' (' + wElo + ')' : '';
    document.getElementById('gib-belo').textContent   = bElo  ? ' (' + bElo + ')' : '';
    document.getElementById('gib-result').textContent = result ? '  ' + result : '';

    const parts = [];
    if (date)  parts.push('📅 ' + date);
    if (event) parts.push('🏆 ' + event);
    if (site && site !== event) parts.push('📍 ' + site);
    if (round) parts.push('🔢 R' + round);
    document.getElementById('gib-meta').textContent = parts.join('  ·  ');

    bar.classList.add('visible');
  }

  function loadVariation(oid) {
  _freeExploreFen = null;
  let found = false;
  for (const ch of COURSE.chapters) {
    for (const v of ch.variations) {
      if (v.oid === oid) {
        currentVar = v.game;
        found = true;
        break;
      }
    }
    if (found) break;
  }
  if (!currentVar) return;

  moves = currentVar.data || [];
  initialFen = currentVar.initial || 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  orientation = currentVar.color === 'black' ? 'black' : 'white';
  // Start at first isKey move (like Chessable)
  const firstKeyIdx = moves.findIndex(m => m.isKey);
  cursor = (firstKeyIdx >= 0) ? firstKeyIdx : -1;
  varState = null;

  // Pre-compute all main line FENs for variation move backtracking.
  // Use applyMoveOrNull so null moves (--/Z0) advance the position too —
  // chess.js's move() silently fails on null moves, which would leave _mainLineFens
  // out of sync with the move list and break variation FEN lookup.
  const mlc = new Chess(initialFen);
  window._mainLineFens = [initialFen];
  window._mainLineMoves = []; // track actual move numbers from data (FEN counters may be truncated)
  for (const m of moves) {
    if (applyMoveOrNull(mlc, m.san)) {
      window._mainLineFens.push(mlc.fen());
      window._mainLineMoves.push({ fen: mlc.fen(), moveNum: m.move, isBlack: m.col === 'b' });
    }
  }

  // Update URL hash
  history.replaceState(null, '', '#' + oid);

  // Update sidebar — also expand parent chapter
  document.querySelectorAll('.var-item').forEach(el => {
    el.classList.toggle('active', el.dataset.oid === oid);
    if (el.dataset.oid === oid) {
      const varList = el.closest('.var-list');
      if (varList && !varList.classList.contains('open')) {
        varList.classList.add('open');
        const arrow = varList.previousElementSibling?.querySelector('.ch-arrow');
        if (arrow) arrow.classList.add('open');
      }
      // Scroll sidebar to show active variation
      const sidebarScroll = document.querySelector('.sidebar-scroll');
      if (sidebarScroll) {
        const sRect = sidebarScroll.getBoundingClientRect();
        const eRect = el.getBoundingClientRect();
        sidebarScroll.scrollTo({top: sidebarScroll.scrollTop + eRect.top - sRect.top - sRect.height * 0.5, behavior: 'smooth'});
      }
    }
  });

  // Update title
  document.getElementById('var-title').textContent = currentVar.title || '';
  updateGameInfoBar(currentVar);
  const mt = document.getElementById('mobile-title');
  if (mt) mt.textContent = currentVar.title || '';
  // Close mobile sidebar on variation select
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('mobileOverlay');
  if (sb) sb.classList.remove('mobile-open');
  if (ov) ov.classList.remove('show');

  // Reset notation scroll to top before rendering
  const notationEl = document.getElementById('notation');
  if (notationEl) notationEl.scrollTop = 0;

  // Set board
  board.orientation(orientation);
  board.position(initialFen, false);
  renderBoardCoordOverlay();
  if (window.__refreshBoardThemeFromSettings) window.__refreshBoardThemeFromSettings();

  // Render
  renderNotation();
  updatePosition();

  // Restart trainer if active (callback set by init)
  if (window._onVariationLoaded) window._onVariationLoaded();
}

// ===== VARIATION LINK NAVIGATION =====
function goToVariationMove(oid, moveIdx) {
  // moveIdx is the index into the data array (compatible with Chessable URL: /learn/COURSE/OID/INDEX)
  history.pushState(null, '', '#' + oid + '/' + moveIdx);
  loadVariation(oid);
  // Navigate to the move at the given index
  if (moveIdx >= 0 && moveIdx < moves.length) {
    cursor = moveIdx;
    updatePosition();
  } else {
    updatePosition();
  }
}

// Get the current board FEN based on cursor / varState
function _getCurrentBoardFen() {
  if (varState && varState.els && varState.els[varState.idx]) {
    return varState.els[varState.idx].dataset.fen || (cursor < 0 ? initialFen : getFenAtMove(cursor));
  }
  if (_freeExploreFen) return _freeExploreFen;
  return cursor < 0 ? initialFen : getFenAtMove(cursor);
}

// Try to match a played move (from,to,san) against the next mainline move or variation moves.
// Returns true if matched (and advances cursor / varState), false to reject.
function _tryMatchNotation(move) {
  const curFen = _getCurrentBoardFen();

  // If in a variation, check the next sibling var-move first
  if (varState) {
    if (varState.idx < varState.els.length - 1) {
      const nextEl = varState.els[varState.idx + 1];
      if (nextEl.dataset.from === move.from && nextEl.dataset.to === move.to) {
        nextEl.click();
        return true;
      }
    }
  }

  // Check next mainline move (only if not deep in a variation)
  if (!varState) {
    const nextIdx = cursor + 1;
    if (nextIdx < moves.length) {
      const prevFen = cursor < 0 ? initialFen : getFenAtMove(cursor);
      const tc = new Chess(prevFen);
      const expected = tc.move(moves[nextIdx].san, {sloppy: true});
      if (expected && expected.from === move.from && expected.to === move.to) {
        cursor = nextIdx;
        updatePosition();
        return true;
      }
    }
  }

  // Check ALL var-move elements — find ones reachable from the current board position
  const varMoves = document.querySelectorAll('.var-move[data-fen][data-from][data-to]');
  for (const el of varMoves) {
    if (el.dataset.from === move.from && el.dataset.to === move.to) {
      // Verify the move produces the expected FEN from the current position
      const tc2 = new Chess(curFen);
      const r = tc2.move({ from: move.from, to: move.to, promotion: move.promotion || 'q' });
      if (r && tc2.fen() === el.dataset.fen) {
        el.click();
        return true;
      }
    }
  }
  return false;
}

}

function _getBoardDragBounds(boardEl) {
  const squares = boardEl.querySelectorAll('[data-square]');
  if (!squares.length) return boardEl.getBoundingClientRect();

  let left = Infinity, top = Infinity, right = -Infinity, bottom = -Infinity;
  squares.forEach(function(el) {
    const r = el.getBoundingClientRect();
    left = Math.min(left, r.left);
    top = Math.min(top, r.top);
    right = Math.max(right, r.right);
    bottom = Math.max(bottom, r.bottom);
  });
  return { left, top, right, bottom };
}
